<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Inbound Summary</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <meta name="theme-color" content="#1e293b">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        .matrix-container {
            -webkit-overflow-scrolling: touch;
        }

        .matrix-table th,
        .matrix-table td {
            text-align: right;
            vertical-align: middle;
            white-space: nowrap;
        }

        .matrix-table thead th {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: #f1f5f9;
        }

        .matrix-table thead th:first-child {
            z-index: 40;
        }

        .matrix-table tbody th:first-child,
        .matrix-table tbody td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: inherit;
        }

        .matrix-table thead tr {
            background-color: #f8fafc;
        }

        .matrix-table tbody tr {
            background-color: #ffffff;
            transition: background-color 0.15s;
        }

        .matrix-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .matrix-table tbody tr.bg-gray-100 {
            background-color: #f3f4f6;
        }

        .matrix-table tbody tr.bg-slate-800 {
            background-color: #1e293b;
        }

        .matrix-table tbody tr.bg-slate-800:hover {
            background-color: #1e293b;
        }

        .matrix-table th:first-child::after,
        .matrix-table td:first-child::after {
            content: '';
            position: absolute;
            top: 0;
            right: -4px;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
        }

        .matrix-table th:nth-child(2) {
            text-align: left;
        }

        .matrix-table td:not([colspan])+td:nth-child(2) {
            text-align: left;
        }

        /* Pull to refresh styles */
        #ptr-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            z-index: 50;
            pointer-events: none;
        }

        #ptr-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .refreshing #ptr-container {
            transform: translateY(0);
        }
        
        .refreshing-body {
            transform: translateY(60px);
            transition: transform 0.3s ease;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item svg {
            width: 40px;
            height: 40px;
            margin-bottom: 6px;
            transition: stroke 0.2s;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-item.active svg {
            stroke: #3b82f6;
        }
    </style>
</head>

<body class="h-screen overflow-hidden text-slate-800 bg-gray-50 flex flex-col">

    <!-- Pull to Refresh Spinner -->
    <div id="ptr-container">
        <div id="ptr-spinner"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="w-full flex-1 flex flex-col min-h-0 pb-24 px-2 sm:px-4 transition-transform duration-300" style="padding-top: calc(1rem + env(safe-area-inset-top));">
        
        <div id="loading" class="text-blue-600 font-medium text-center py-8 hidden">
            <div class="flex flex-col items-center gap-3">
                <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                <div>Fetching latest data...</div>
            </div>
        </div>

        <div id="preview-view" class="w-full h-full mx-auto flex flex-col hidden min-h-0">
            <div class="flex justify-between w-full mb-4 gap-4 px-1 items-center shrink-0">
                <div class="text-sm font-semibold text-slate-500" id="last-updated"></div>
                <div class="flex gap-2">
                    <button id="download-btn"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-sm flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Download Image
                    </button>
                </div>
            </div>

            <!-- THE TABLE -->
            <div id="capture-area"
                class="bg-white sm:rounded-xl sm:shadow-lg border sm:border border-gray-200 w-fit mx-auto flex flex-col min-h-0 max-w-full">
                <div class="bg-slate-800 px-3 sm:px-4 py-3 border-b border-slate-700 flex justify-between items-center rounded-t-xl shrink-0">
                    <div>
                        <h2
                            class="text-base sm:text-lg font-semibold text-white tracking-wide uppercase flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 text-blue-400"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                            </svg>
                            Rail Inbound Summary
                        </h2>
                        <p id="report-subtitle" class="text-slate-300 text-[10px] sm:text-xs mt-1">Summary of Inbound
                            Car Counts - [Date]</p>
                    </div>
                </div>

                <div class="matrix-container flex-1 overflow-auto">
                    <table class="matrix-table text-[10px] sm:text-xs text-gray-700 mx-auto" id="result-table">
                        <thead>
                            <tr id="table-head-row"
                                class="text-slate-600 border-b border-gray-200 uppercase tracking-wider font-semibold">
                                <!-- Populated by JS -->
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-100">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="tab-inbound" onclick="switchTab('inbound')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            <span>Inbound</span>
        </div>
        <div class="nav-item" id="tab-po" onclick="switchTab('po')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            <span>POs</span>
        </div>
        <div class="nav-item" id="tab-service" onclick="switchTab('service')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <span>Service</span>
        </div>
    </nav>

    <!-- Modal -->
    <div id="car-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 px-4">
        <div class="bg-white rounded-xl shadow-2xl w-auto max-w-[95vw] md:max-w-2xl max-h-[80vh] flex flex-col transform scale-95 transition-transform duration-300">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">Car Details</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-full hover:bg-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-0 overflow-y-auto flex-1">
                <table class="text-left text-xs text-slate-600 min-w-full">
                    <thead class="bg-slate-50 sticky top-0 border-b border-slate-200 shadow-sm">
                        <tr id="modal-thead-row">
                            <!-- Populated dynamically -->
                        </tr>
                    </thead>
                    <tbody id="modal-tbody" class="divide-y divide-slate-100">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'inbound';
        let isFetching = false;
        let cachedTSV = { data: null };
        let lastFetchTime = { data: 0 };

        const DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkTbgVZmqUfy2tr9WS7lIkFjFPe2_6ws1YeuZdvB5syDdbCQCRkGwCoOVM-lcjVNEUo-scS4QajqJV/pub?gid=0&single=true&output=tsv";

        // Fallback array of CORS proxies to ensure high availability
        const PROXIES = [
            "https://api.codetabs.com/v1/proxy?quest=",
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?"
        ];

        async function fetchTSV(url) {
            for (const proxyBase of PROXIES) {
                try {
                    const response = await fetch(proxyBase + encodeURIComponent(url));
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.text();
                } catch (err) {
                    console.warn(`Proxy ${proxyBase} failed for ${url}:`, err);
                }
            }
            throw new Error('All CORS proxies failed.');
        }

        async function fetchData(force = false, isSilent = false) {
            if (isFetching) return;

            const now = Date.now();
            const needsData = force || !cachedTSV.data || (now - lastFetchTime.data >= 21600000);

            if (!needsData) {
                renderTab(cachedTSV.data);
                return;
            }

            isFetching = true;

            if (!isSilent && !cachedTSV.data) {
                document.getElementById('loading').classList.remove('hidden');
                document.getElementById('preview-view').classList.add('hidden');
            }

            try {
                const res = await fetchTSV(DATA_URL);
                cachedTSV.data = res;
                lastFetchTime.data = Date.now();

                renderTab(cachedTSV.data);
            } catch (err) {
                if (!isSilent) alert('Error fetching data: ' + err.message);
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                isFetching = false;
                document.body.classList.remove('refreshing');
                document.getElementById('main-content').classList.remove('refreshing-body');
            }
        }

        function openModal(title, cols, cars) {
            document.getElementById('modal-title').innerText = title;
            const thead = document.getElementById('modal-thead-row');
            
            const getColClass = (colName, isHeader) => {
                let cls = isHeader ? "px-3 py-2 font-semibold text-slate-700 align-bottom leading-tight" : "px-3 py-2 align-top";
                if (colName === 'Line Item') cls += " w-12 sm:w-16 text-center";
                else if (colName === 'Waybill Date') cls += " w-16 sm:w-20 text-center";
                else if (colName === 'ETA') cls += " w-16 text-center";
                else if (colName === 'Car Number') cls += " w-24 whitespace-nowrap";
                else if (colName === 'Comments') cls += " min-w-[120px]"; // Let it expand
                else cls += " whitespace-nowrap";
                return cls;
            };

            thead.innerHTML = cols.map(c => `<th class="${getColClass(c, true)}">${c}</th>`).join('');
            
            const tbody = document.getElementById('modal-tbody');
            if (cars.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${cols.length}" class="px-4 py-8 text-center text-slate-400 italic">No cars found.</td></tr>`;
            } else {
                tbody.innerHTML = cars.map(car => {
                    return `<tr class="hover:bg-slate-50 transition-colors">` + 
                        cols.map(c => `<td class="${getColClass(c, false)}">${car[c] || '-'}</td>`).join('') +
                    `</tr>`;
                }).join('');
            }

            const modal = document.getElementById('car-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-95');
        }

        function closeModal() {
            const modal = document.getElementById('car-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
        }
        
        // Close modal on outside click
        document.getElementById('car-modal').addEventListener('click', (e) => {
            if (e.target.id === 'car-modal') closeModal();
        });

        function renderTab(tsv) {
            if (currentTab === 'inbound') {
                generateTable(tsv);
            } else if (currentTab === 'po') {
                generatePOTable(tsv);
            } else {
                generateServiceStorageTable(tsv);
            }
            const captureArea = document.getElementById('capture-area');
            if (currentTab === 'service') {
                captureArea.classList.remove('w-fit');
                captureArea.classList.add('w-full', 'max-w-5xl');
            } else {
                captureArea.classList.add('w-fit');
                captureArea.classList.remove('w-full', 'max-w-5xl');
            }
            // Format subtitle date
            const dateObj = new Date(lastFetchTime.data || Date.now()); 
            const options = { month: 'long', day: 'numeric', year: 'numeric' };
            let titleDisplay = document.querySelector('#preview-view h2');
            let subtitleText = '';

            if (currentTab === 'inbound') {
                titleDisplay.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg> RAIL INBOUND SUMMARY`;
                subtitleText = 'Summary of Inbound Car Counts';
            } else if (currentTab === 'po') {
                titleDisplay.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg> RAIL PURCHASE ORDER SUMMARY`;
                subtitleText = 'Summary of Active Purchase Orders';
            } else {
                titleDisplay.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg> SERVICE AND STORAGE`;
                subtitleText = 'Summary of Service and Storage Cars';
            }

            document.getElementById('report-subtitle').innerText = `${subtitleText} - ${dateObj.toLocaleDateString('en-US', options)}`;
            
            // Update Last Updated Text
            const timeStr = dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('last-updated').innerText = `Updated: ${timeStr}`;

            document.getElementById('preview-view').classList.remove('hidden');
        }

        function switchTab(tab) {
            if (currentTab === tab || isFetching) return;
            currentTab = tab;
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            fetchData();
        }

        document.getElementById('download-btn').addEventListener('click', () => {
            let prefix = 'Rail_Summary';
            if (currentTab === 'inbound') prefix = 'Rail_Inbound_Summary';
            else if (currentTab === 'po') prefix = 'Rail_Purchase_Order_Summary';
            else prefix = 'Rail_Service_Storage_Summary';
            const dateStr = new Date().toISOString().split('T')[0];
            const element = document.getElementById('capture-area');
            const container = element.querySelector('.matrix-container');

            // Temporarily remove overflow constraints and break out of flex layouts
            const origElementStyle = element.getAttribute('style');
            const origContainerStyle = container.getAttribute('style');
            const origBodyOverflow = document.body.style.overflow;
            
            document.body.style.overflow = 'visible';
            
            element.style.position = 'absolute';
            element.style.top = '0';
            element.style.left = '0';
            element.style.height = 'auto';
            element.style.maxHeight = 'none';
            element.style.zIndex = '9999';
            
            container.style.height = 'auto';
            container.style.maxHeight = 'none';
            container.style.overflow = 'visible';

            setTimeout(() => {
                html2canvas(element, { 
                    scale: 2, 
                    backgroundColor: null,
                    scrollY: -window.scrollY,
                    windowHeight: element.scrollHeight,
                    height: element.scrollHeight
                }).then(canvas => {
                    // Restore constraints
                    document.body.style.overflow = origBodyOverflow;
                    
                    if (origElementStyle === null) element.removeAttribute('style');
                    else element.setAttribute('style', origElementStyle);
                    
                    if (origContainerStyle === null) container.removeAttribute('style');
                    else container.setAttribute('style', origContainerStyle);

                    canvas.toBlob(blob => {
                        const file = new File([blob], `${prefix}_${dateStr}.png`, { type: 'image/png' });
                        if (window.AndroidShareHandler) {
                            const reader = new FileReader();
                            reader.onloadend = function() {
                                window.AndroidShareHandler.shareImage(reader.result, `${prefix}_${dateStr}.png`);
                            }
                            reader.readAsDataURL(blob);
                        } else if (navigator.share && /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                            navigator.share({
                                title: 'Rail Summary',
                                files: [file]
                            }).catch(console.error);
                        } else {
                            const link = document.createElement('a');
                            link.download = `${prefix}_${dateStr}.png`;
                            link.href = URL.createObjectURL(blob);
                            link.click();
                            URL.revokeObjectURL(link.href);
                        }
                    });
                });
            }, 100);
        });

        function generateTable(tsv) {
            const lines = tsv.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (lines.length < 2) return;

            const headers = lines[0].split('\t').map(h => h.trim());
            const colMap = {};
            headers.forEach((h, i) => colMap[h] = i);
            
            // ETA column could be ETA or Current ETA
            const etaColIdx = colMap['ETA'] !== undefined ? colMap['ETA'] : colMap['Current ETA'];

            // We need to group by Location and Product
            // Data structure:
            // locMap = { locName: { total: 0, prods: { prodName: { total: 0, etas: { etaKey: count }, cars: { etaKey: [] } } } } }
            const locMap = new Map();
            const allEtas = new Set();

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split('\t');
                let loc = row[colMap['Delivery Location']] ? row[colMap['Delivery Location']].trim() : '';
                let rawProd = row[colMap['Product']] ? row[colMap['Product']].trim() : '';
                const poStr = row[colMap['Purchase Order']] ? row[colMap['Purchase Order']].trim().toLowerCase() : '';
                
                if (!loc && !rawProd && !poStr) continue;
                if (poStr.includes('service') || poStr.includes('storage')) continue;
                
                let prod = rawProd;
                if (poStr.includes('return') || poStr.includes('outbound')) {
                    prod = 'Empty';
                } else if (poStr.includes('ict')) {
                    prod = rawProd || 'ATS'; // ICT usually ATS
                }
                if (!prod) prod = 'Unknown';
                
                const tripComplete = row[colMap['Trip Complete']] ? row[colMap['Trip Complete']].trim().toLowerCase() : '';
                if (tripComplete === 'yes' || tripComplete === 'y' || tripComplete === 'cancelled') continue;

                let rawEta = etaColIdx !== undefined && row[etaColIdx] ? row[etaColIdx].trim() : '';
                let eta = '';
                
                if (rawEta) {
                    const lower = rawEta.toLowerCase();
                    if (lower === 'onsite') eta = 'Onsite';
                    else if (lower === 'offline') eta = 'Offline';
                    else if (lower === 'interchange' || lower === 'inter') eta = 'Inter';
                    else if (lower === 'cp') eta = 'CP';
                    else if (rawEta.includes('/')) {
                        // Normalize date to MM/DD
                        let parts = rawEta.split('/');
                        eta = parts[0].padStart(2, '0') + '/' + parts[1].padStart(2, '0');
                    } else {
                        eta = rawEta; // Fallback
                    }
                }

                if (eta) {
                    allEtas.add(eta);
                }

                if (!locMap.has(loc)) {
                    locMap.set(loc, { total: 0, etas: {}, prods: new Map() });
                }
                const locData = locMap.get(loc);
                
                if (!locData.prods.has(prod)) {
                    locData.prods.set(prod, { total: 0, etas: {}, cars: {} });
                }
                const prodData = locData.prods.get(prod);

                const carObj = {
                    'Waybill Date': row[colMap['Waybill Date']] ? row[colMap['Waybill Date']].trim() : '',
                    'Vendor': row[colMap['Vendor']] ? row[colMap['Vendor']].trim() : '',
                    'Product': rawProd,
                    'Car Number': row[colMap['Car Number']] ? row[colMap['Car Number']].trim() : '',
                    'Comments': row[colMap['Comments']] ? row[colMap['Comments']].trim() : ''
                };

                if (eta) {
                    locData.total++;
                    prodData.total++;
                    
                    locData.etas[eta] = (locData.etas[eta] || 0) + 1;
                    prodData.etas[eta] = (prodData.etas[eta] || 0) + 1;
                    if (!prodData.cars[eta]) prodData.cars[eta] = [];
                    prodData.cars[eta].push(carObj);
                }
            }

            // Standardize columns
            const dateCols = [];
            allEtas.forEach(eta => {
                if (eta !== 'Onsite' && eta !== 'Offline' && eta !== 'Inter' && eta !== 'CP') {
                    dateCols.push(eta);
                }
            });

            dateCols.sort((a, b) => {
                const da = new Date(a + '/2026'); // dummy year
                const db = new Date(b + '/2026');
                return da - db;
            });

            const outputCols = [];
            if (allEtas.has('Onsite')) outputCols.push({ label: 'Onsite', key: 'Onsite' });
            if (allEtas.has('CP')) outputCols.push({ label: 'CP', key: 'CP' });
            if (allEtas.has('Inter')) outputCols.push({ label: 'Inter', key: 'Inter' });
            dateCols.forEach(d => outputCols.push({ label: d, key: d }));
            if (allEtas.has('Offline')) outputCols.push({ label: 'Offline', key: 'Offline' });

            const repDate = new Date();
            const mo = String(repDate.getMonth() + 1).padStart(2, '0');
            const da = String(repDate.getDate()).padStart(2, '0');
            const highlightLabel = `${mo}/${da}`;

            // Build Header
            const thead = document.getElementById('table-head-row');
            thead.className = "text-slate-600 uppercase tracking-wider font-semibold";
            thead.innerHTML = `<th class="px-2 py-3 align-bottom leading-tight min-w-[100px] border-b border-gray-200">Delivery Location</th><th class="px-2 py-3 align-bottom leading-tight min-w-[60px] border-b border-gray-200">Product</th>`;

            outputCols.forEach(c => {
                let thClass = 'px-0 align-middle w-7';
                let innerContent = `<div class="h-20 relative w-full"><div class="absolute inset-0 flex items-center justify-center"><div class="-rotate-90 whitespace-nowrap text-[10px] tracking-wider">${c.label}</div></div></div>`;

                if (c.label === highlightLabel) {
                    thead.innerHTML += `<th class="${thClass} bg-blue-50 text-blue-700 border-b border-blue-200">${innerContent}</th>`;
                } else if (c.label === 'Offline') {
                    thead.innerHTML += `<th class="${thClass} text-orange-600 border-b border-gray-200">${innerContent}</th>`;
                } else {
                    thead.innerHTML += `<th class="${thClass} border-b border-gray-200">${innerContent}</th>`;
                }
            });

            let gtThClass = 'px-0 align-middle w-12 border-b border-slate-300';
            let gtInnerContent = `<div class="h-20 relative w-full"><div class="absolute inset-0 flex items-center justify-center"><div class="-rotate-90 text-[10px] tracking-wider leading-tight text-center">Grand<br>Total</div></div></div>`;
            thead.innerHTML += `<th class="${gtThClass} bg-slate-100 text-slate-800">${gtInnerContent}</th>`;

            // Build Body
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            let grandTotalOverall = 0;
            const grandTotalEtas = {};

            const sortedLocs = Array.from(locMap.keys()).sort();

            for (const loc of sortedLocs) {
                const locData = locMap.get(loc);
                if (locData.total === 0) continue; // Skip empty locations

                const sortedProds = Array.from(locData.prods.keys()).sort();
                let isFirstProd = true;

                for (const prod of sortedProds) {
                    const prodData = locData.prods.get(prod);
                    if (prodData.total === 0) continue; // Skip empty products

                    let html = `<tr class="transition-colors border-t-0">`;
                    
                    html += `<td class="px-2 text-gray-900 py-1.5 leading-snug">${isFirstProd ? loc : ''}</td>`;
                    html += `<td class="px-2 py-1.5 leading-snug">${prod}</td>`;
                    
                    isFirstProd = false;

                    outputCols.forEach(c => {
                        const count = prodData.etas[c.key] || 0;
                        const dispVal = count === 0 ? '-' : count;
                        let tdClass = `px-1 py-1.5 text-center`;

                        if (dispVal === '-') tdClass += ' text-gray-400';
                        else if (c.key === 'Onsite') tdClass += ' font-medium';
                        else if (c.key === 'Inter') tdClass += ' font-medium text-purple-600';
                        else if (c.key === 'Offline') tdClass += ' font-medium text-orange-600';

                        if (c.label === highlightLabel) {
                            tdClass += ' font-semibold bg-blue-50 text-blue-700';
                        }

                        if (dispVal !== '-') {
                            tdClass += ' cursor-pointer hover:bg-slate-200/50 transition-colors';
                            const carsStr = encodeURIComponent(JSON.stringify(prodData.cars[c.key]));
                            const colsArrayStr = `['Waybill Date','Vendor','Product','Car Number','Comments']`;
                            const title = `Inbound - ${loc} ${prod} - ${c.label}`;
                            html += `<td class="${tdClass}" data-cars="${carsStr}" onclick="handleCellClick(this, '${title}', ${colsArrayStr})">${dispVal}</td>`;
                        } else {
                            html += `<td class="${tdClass}">${dispVal}</td>`;
                        }
                    });

                    const gtVal = prodData.total || '-';
                    html += `<td class="px-1 bg-slate-50 font-medium py-1.5 text-center">${gtVal}</td>`;
                    html += `</tr>`;
                    tbody.innerHTML += html;
                }

                // Subtotal Row
                let html = `<tr class="bg-gray-100 font-semibold text-gray-900 border-b-2 border-gray-200">`;
                html += `<td colspan="2" class="px-2 py-2 leading-snug">${loc} Total</td>`;

                outputCols.forEach(c => {
                    const count = locData.etas[c.key] || 0;
                    const dispVal = count === 0 ? '-' : count;
                    let tdClass = `px-1 py-2 text-center`;

                    if (dispVal === '-') tdClass += ' text-gray-400';
                    else if (c.key === 'Inter') tdClass += ' text-purple-700';
                    else if (c.key === 'Offline') tdClass += ' text-orange-700';

                    if (c.label === highlightLabel) {
                        tdClass += ' font-bold bg-blue-100 text-blue-800';
                    }

                    html += `<td class="${tdClass}">${dispVal}</td>`;
                    
                    grandTotalEtas[c.key] = (grandTotalEtas[c.key] || 0) + count;
                });

                const stTotal = locData.total || '-';
                html += `<td class="px-1 bg-slate-200 py-2 text-center">${stTotal}</td>`;
                html += `</tr>`;
                tbody.innerHTML += html;
                
                grandTotalOverall += locData.total;
            }

            // Grand Total Row
            let html = `<tr class="bg-slate-800 text-white font-bold text-[11px] sm:text-xs">`;
            html += `<td colspan="2" class="px-2 rounded-bl-lg py-2.5 leading-snug">Grand Total</td>`;

            outputCols.forEach(c => {
                const count = grandTotalEtas[c.key] || 0;
                const dispVal = count === 0 ? '-' : count;
                let tdClass = `px-1 py-2.5 text-center`;

                if (dispVal === '-') tdClass += '';
                else if (c.key === 'Onsite') tdClass += ' text-emerald-400';
                else if (c.key === 'Inter') tdClass += ' text-purple-300';
                else if (c.key === 'Offline') tdClass += ' text-orange-400';

                if (c.label === highlightLabel) {
                    tdClass += ' bg-slate-700 text-blue-300';
                }

                html += `<td class="${tdClass}">${dispVal}</td>`;
            });

            html += `<td class="px-1 bg-slate-900 rounded-br-lg border-l border-slate-700 py-2.5 text-center">${grandTotalOverall}</td>`;
            html += `</tr>`;
            tbody.innerHTML += html;
        }

        function generatePOTable(tsv) {
            const lines = tsv.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (lines.length === 0) return;

            const headers = lines[0].split('\t').map(h => h.trim());
            const colMap = {};
            headers.forEach((h, i) => colMap[h] = i);

            const poMap = new Map();

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split('\t');
                const po = row[colMap['Purchase Order']] ? row[colMap['Purchase Order']].trim() : '';
                if (!po) continue;

                const poLower = po.toLowerCase();
                if (poLower.includes('outbound') || poLower.includes('ict') || poLower.includes('return') || poLower.includes('service') || poLower.includes('storage')) continue;

                const loc = row[colMap['Delivery Location']] ? row[colMap['Delivery Location']].trim() : '';
                const prod = row[colMap['Product']] ? row[colMap['Product']].trim() : '';
                const vendor = row[colMap['Vendor']] ? row[colMap['Vendor']].trim() : '';
                const month = row[colMap['Contract Month']] ? row[colMap['Contract Month']].trim() : '';
                const waybill = row[colMap['Waybill Date']] ? row[colMap['Waybill Date']].trim() : '';
                const etaColIdx = colMap['ETA'] !== undefined ? colMap['ETA'] : colMap['Current ETA'];
                const eta = etaColIdx !== undefined && row[etaColIdx] ? row[etaColIdx].trim() : '';
                const tripComplete = row[colMap['Trip Complete']] ? row[colMap['Trip Complete']].toLowerCase().trim() : '';

                if (tripComplete === 'cancelled') continue;

                const mapKey = `${po}_${loc}_${prod}`; // Unique key to handle edge cases if PO is reused across locs

                if (!poMap.has(mapKey)) {
                    poMap.set(mapKey, {
                        po: po,
                        loc: loc,
                        prod: prod,
                        vendor: vendor,
                        month: month,
                        total: 0,
                        received: 0,
                        yesCount: 0,
                        shipped: 0,
                        remaining: 0,
                        etas: [],
                        receivedCars: [],
                        shippedCars: [],
                        remainingCars: []
                    });
                }

                const pData = poMap.get(mapKey);
                pData.total++;
                
                const carObj = {
                    'Line Item': row[colMap['Line Item']] ? row[colMap['Line Item']].trim() : '',
                    'Waybill Date': waybill,
                    'Car Number': row[colMap['Car Number']] ? row[colMap['Car Number']].trim() : '',
                    'ETA': eta,
                    'Comments': row[colMap['Comments']] ? row[colMap['Comments']].trim() : ''
                };

                if (tripComplete === 'yes' || tripComplete === 'y') {
                    pData.yesCount++;
                    pData.received++;
                    pData.receivedCars.push(carObj);
                } else if (tripComplete === 'unloaded') {
                    pData.received++;
                    pData.receivedCars.push(carObj);
                } else {
                    if (waybill) {
                        pData.shipped++;
                        pData.shippedCars.push(carObj);
                    } else {
                        pData.remaining++;
                        pData.remainingCars.push(carObj);
                    }
                    if (eta) {
                        pData.etas.push(eta);
                    }
                }
            }

            const activePOs = Array.from(poMap.values()).filter(p => p.total > p.yesCount);

            activePOs.sort((a, b) => {
                if (a.loc !== b.loc) return a.loc.localeCompare(b.loc);
                if (a.prod !== b.prod) return a.prod.localeCompare(b.prod);
                return a.po.localeCompare(b.po);
            });

            const thead = document.getElementById('table-head-row');
            thead.className = "text-slate-600 border-b-2 border-gray-300 uppercase tracking-wider font-semibold bg-slate-100";

            const thClass = "px-2 py-3 align-bottom leading-tight text-[11px] sm:text-xs !text-center";
            const thNumClass = "px-2 py-3 align-bottom leading-tight !text-center text-[11px] sm:text-xs";
            thead.innerHTML = `
                <th class="${thClass}">Delivery<br>Location</th>
                <th class="${thClass}">Product</th>
                <th class="${thClass}">Purchase<br>Order</th>
                <th class="${thClass}">Vendor</th>
                <th class="${thNumClass}">Contract<br>Month</th>
                <th class="${thNumClass}">Total<br>Ordered</th>
                <th class="${thNumClass}">Received</th>
                <th class="${thNumClass}">Shipped</th>
                <th class="${thNumClass}">Remaining</th>
                <th class="${thClass}">ETA Next<br>Car</th>
            `;

            const tbody = document.getElementById('table-body');
            let html = '';

            // 1. Build flat array of all rows to render (POs and Subtotals)
            let renderRows = [];
            let groupedPOs = new Map();

            activePOs.forEach(p => {
                let key = `${p.loc}_${p.prod}`;
                if (!groupedPOs.has(key)) {
                    groupedPOs.set(key, { loc: p.loc, prod: p.prod, pos: [] });
                }
                groupedPOs.get(key).pos.push(p);
            });

            for (let [key, group] of groupedPOs) {
                if (group.pos.length > 1) {
                    let stOrdered = 0, stReceived = 0, stShipped = 0, stRemaining = 0;
                    group.pos.forEach(p => {
                        stOrdered += p.total;
                        stReceived += p.received;
                        stShipped += p.shipped;
                        stRemaining += p.remaining;
                    });
                    renderRows.push({
                        type: 'subtotal',
                        loc: group.loc,
                        prod: group.prod,
                        ordered: stOrdered,
                        received: stReceived,
                        shipped: stShipped,
                        remaining: stRemaining
                    });
                }
                
                group.pos.forEach(p => {
                    renderRows.push({
                        type: 'po',
                        data: p,
                        loc: p.loc,
                        prod: p.prod
                    });
                });
            }

            // 2. Pre-calculate wire boundaries
            let lastNamedProdRowForLoc = {};
            let lastRowForProdGroup = {};

            for (let i = 0; i < renderRows.length; i++) {
                let r = renderRows[i];
                if (!lastNamedProdRowForLoc[r.loc]) lastNamedProdRowForLoc[r.loc] = {};
                if (lastNamedProdRowForLoc[r.loc][r.prod] === undefined) {
                    lastNamedProdRowForLoc[r.loc].lastIndex = i;
                    lastNamedProdRowForLoc[r.loc][r.prod] = i;
                }
                lastRowForProdGroup[`${r.loc}_${r.prod}`] = i;
            }

            // 3. Assign wire types
            for (let i = 0; i < renderRows.length; i++) {
                let r = renderRows[i];

                // Location Wire
                let firstRowOfLoc = i === 0 || renderRows[i - 1].loc !== r.loc;
                if (firstRowOfLoc) {
                    r.locWire = '';
                } else {
                    let lastNamedIdx = lastNamedProdRowForLoc[r.loc].lastIndex;
                    if (i < lastNamedIdx) {
                        r.locWire = (lastNamedProdRowForLoc[r.loc][r.prod] === i) ? 'T' : 'I';
                    } else if (i === lastNamedIdx) {
                        r.locWire = 'L';
                    } else {
                        r.locWire = '';
                    }
                }

                // Product Wire
                let firstRowOfProd = lastNamedProdRowForLoc[r.loc][r.prod] === i;
                if (firstRowOfProd) {
                    r.prodWire = '';
                } else {
                    let lastRowIdx = lastRowForProdGroup[`${r.loc}_${r.prod}`];
                    if (i < lastRowIdx) {
                        r.prodWire = 'T';
                    } else if (i === lastRowIdx) {
                        r.prodWire = 'L';
                    } else {
                        r.prodWire = '';
                    }
                }
            }

            // 4. Render HTML
            const tdClass = "px-3 py-2.5 align-middle text-sm text-gray-800 !text-left";
            const tdNumClass = "px-3 py-2.5 align-middle text-sm text-gray-800 !text-center font-medium";

            function renderWire(wireType) {
                if (wireType === 'I') return `<div class="absolute right-8 top-0 bottom-0 border-l-2 border-slate-300"></div>`;
                if (wireType === 'T') return `<div class="absolute right-8 top-0 bottom-0 border-l-2 border-slate-300"></div><div class="absolute right-0 top-1/2 w-8 border-t-2 border-slate-300"></div>`;
                if (wireType === 'L') return `<div class="absolute right-8 top-0 h-1/2 border-l-2 border-slate-300"></div><div class="absolute right-0 top-1/2 w-8 border-t-2 border-slate-300"></div>`;
                return '';
            }

            function buildTD(cars, count, baseClass, extraClass, title, cols) {
                if (count === 0) return `<td class="${baseClass} ${extraClass}">-</td>`;
                const carsStr = encodeURIComponent(JSON.stringify(cars));
                const colsArrayStr = `['${cols.join("','")}']`;
                return `<td class="${baseClass} ${extraClass} cursor-pointer hover:bg-slate-200/50" data-cars="${carsStr}" onclick="handleCellClick(this, '${title}', ${colsArrayStr})">${count}</td>`;
            }

            for (let i = 0; i < renderRows.length; i++) {
                let r = renderRows[i];
                let isFirstOfLoc = i === 0 || renderRows[i - 1].loc !== r.loc;
                let isFirstOfProd = isFirstOfLoc || renderRows[i - 1].prod !== r.prod;

                let dispLoc = isFirstOfLoc ? r.loc : '';
                let dispProd = isFirstOfProd ? r.prod : '';

                let borderClass = i > 0 ? 'border-t border-slate-200' : '';

                if (r.type === 'subtotal') {
                    html += `<tr class="${borderClass} bg-slate-50/50">
                        <td class="${tdClass} relative font-bold text-slate-900">${dispLoc}${renderWire(r.locWire)}</td>
                        <td class="${tdClass} relative font-bold text-slate-900">${dispProd}${renderWire(r.prodWire)}</td>
                        <td class="${tdClass} !font-bold !text-slate-900">Total</td>
                        <td class="${tdClass}"></td>
                        <td class="${tdNumClass}"></td>
                        <td class="${tdNumClass} !font-bold !text-slate-900">${r.ordered}</td>
                        <td class="${tdNumClass} !font-bold text-emerald-700">${r.received > 0 ? r.received : '-'}</td>
                        <td class="${tdNumClass} !font-bold text-blue-700">${r.shipped > 0 ? r.shipped : '-'}</td>
                        <td class="${tdNumClass} !font-bold text-red-700">${r.remaining > 0 ? r.remaining : '-'}</td>
                        <td class="${tdClass}"></td>
                    </tr>`;
                } else {
                    let p = r.data;
                    let etaText = '';
                    if (p.shipped > 0 && p.etas.length > 0) {
                        let dates = [];
                        let hasOnsite = false, hasInter = false, hasOffline = false;
                        p.etas.forEach(e => {
                            let lower = e.toLowerCase();
                            if (lower === 'onsite') hasOnsite = true;
                            else if (lower === 'interchange') hasInter = true;
                            else if (lower === 'offline') hasOffline = true;
                            else if (e.includes('/')) dates.push(e);
                        });
                        if (dates.length > 0) {
                            dates.sort();
                            etaText = dates[0];
                        } else if (hasOnsite) etaText = 'Onsite';
                        else if (hasInter) etaText = 'Interchange';
                        else if (hasOffline) etaText = 'Offline';
                    }

                    let etaStyle = '';
                    if (etaText === 'Onsite') etaStyle = 'text-emerald-600 font-semibold';
                    else if (etaText === 'Interchange') etaStyle = 'text-purple-600 font-semibold';
                    else if (etaText === 'Offline') etaStyle = 'text-orange-600 font-semibold';
                    else if (etaText) etaStyle = 'text-blue-600 font-semibold';

                    html += `<tr class="${borderClass} hover:bg-slate-50 transition-colors">
                        <td class="${tdClass} relative font-bold text-slate-900">${dispLoc}${renderWire(r.locWire)}</td>
                        <td class="${tdClass} relative font-bold text-slate-900">${dispProd}${renderWire(r.prodWire)}</td>
                        <td class="${tdClass} text-gray-700 font-medium">${p.po}</td>
                        <td class="${tdClass}">${p.vendor}</td>
                        <td class="${tdNumClass} text-gray-500">${p.month}</td>
                        <td class="${tdNumClass}">${p.total}</td>
                        ${buildTD(p.receivedCars, p.received, tdNumClass, 'text-emerald-600', 'Received Cars', ['Line Item', 'Waybill Date', 'Car Number', 'Comments'])}
                        ${buildTD(p.shippedCars, p.shipped, tdNumClass, 'text-blue-600', 'Shipped Cars', ['Line Item', 'Waybill Date', 'Car Number', 'ETA', 'Comments'])}
                        ${buildTD(p.remainingCars, p.remaining, tdNumClass, 'text-red-600', 'Remaining Cars', ['Line Item', 'Comments'])}
                        <td class="${tdClass} ${etaStyle}">${etaText}</td>
                    </tr>`;
                }
            }

            if (activePOs.length === 0) {
                html = `<tr><td colspan="9" class="px-4 py-8 text-center text-gray-500 italic text-sm">No active purchase orders found.</td></tr>`;
            }

            tbody.innerHTML = html;
        }

        function generateServiceStorageTable(tsv) {
            const lines = tsv.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (lines.length === 0) return;

            const headers = lines[0].split('\t').map(h => h.trim());
            const colMap = {};
            headers.forEach((h, i) => colMap[h] = i);

            const serviceCars = [];
            const storageCars = [];

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split('\t');
                const po = row[colMap['Purchase Order']] ? row[colMap['Purchase Order']].trim().toLowerCase() : '';
                if (!po) continue;
                
                const tripComplete = row[colMap['Trip Complete']] ? row[colMap['Trip Complete']].trim().toLowerCase() : '';
                if (tripComplete === 'yes' || tripComplete === 'y' || tripComplete === 'cancelled') continue;

                const etaColIdx = colMap['ETA'] !== undefined ? colMap['ETA'] : colMap['Current ETA'];
                let eta = etaColIdx !== undefined && row[etaColIdx] ? row[etaColIdx].trim() : '';
                if (!eta && row[colMap['Waybill Date']] && row[colMap['Waybill Date']].trim()) {
                    eta = 'Shipped (No ETA)';
                }

                const carNum = row[colMap['Car Number']] ? row[colMap['Car Number']].trim() : '';
                const loc = row[colMap['Delivery Location']] ? row[colMap['Delivery Location']].trim() : '';
                const comments = row[colMap['Comments']] ? row[colMap['Comments']].trim() : '';

                const carObj = { carNum, loc, eta, comments };

                if (po.includes('service')) {
                    serviceCars.push(carObj);
                } else if (po.includes('storage')) {
                    storageCars.push(carObj);
                }
            }

            serviceCars.sort((a, b) => a.carNum.localeCompare(b.carNum));
            storageCars.sort((a, b) => a.carNum.localeCompare(b.carNum));

            const thead = document.getElementById('table-head-row');
            thead.className = "text-slate-600 border-b-2 border-gray-300 uppercase tracking-wider font-semibold bg-slate-100";
            
            const thClass = "px-4 py-3 align-bottom leading-tight text-[11px] sm:text-xs text-left";
            thead.innerHTML = `
                <th class="${thClass}">Car Number</th>
                <th class="${thClass}">Delivery Location</th>
                <th class="${thClass}">ETA</th>
                <th class="${thClass}">Comments</th>
            `;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const renderSection = (title, cars) => {
                if (cars.length === 0) return;
                
                // Header row
                let html = `<tr class="bg-slate-200 border-b-2 border-slate-300">`;
                html += `<td colspan="4" class="px-4 py-2 text-sm font-bold text-slate-800">${title} (${cars.length})</td>`;
                html += `</tr>`;

                // Cars
                cars.forEach(car => {
                    html += `<tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">`;
                    html += `<td class="px-4 py-2.5 whitespace-nowrap text-xs font-semibold text-slate-700 w-[15%]">${car.carNum || '-'}</td>`;
                    html += `<td class="px-4 py-2.5 whitespace-nowrap text-xs text-slate-600 w-[20%]">${car.loc || '-'}</td>`;
                    html += `<td class="px-4 py-2.5 whitespace-nowrap text-xs text-slate-600 w-[15%]">${car.eta || '-'}</td>`;
                    html += `<td class="px-4 py-2.5 !whitespace-normal break-words text-xs text-slate-600 w-[50%] min-w-[200px]">${car.comments || '-'}</td>`;
                    html += `</tr>`;
                });
                
                tbody.innerHTML += html;
            };

            renderSection('Service', serviceCars);
            renderSection('Storage', storageCars);
            
            if (serviceCars.length === 0 && storageCars.length === 0) {
                 tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400 italic text-sm">No Service or Storage cars found.</td></tr>`;
            }
        }

        // Handle click on cell with data-cars
        window.handleCellClick = function(el, title, cols) {
            const carsStr = el.getAttribute('data-cars');
            if (!carsStr) return;
            const cars = JSON.parse(decodeURIComponent(carsStr));
            openModal(title, cols, cars);
        };

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }

        // Pull to refresh logic
        let touchStartVertical = 0;
        let pStart = { x: 0, y: 0 };
        const content = document.getElementById('main-content');
        let isPulling = false;

        document.addEventListener('touchstart', function (e) {
            const matrix = document.querySelector('.matrix-container');
            const isAtTop = window.scrollY === 0 && (!matrix || matrix.scrollTop === 0);
            if (isAtTop) {
                pStart.y = e.touches[0].screenY;
                isPulling = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
            if (!isPulling) return;
            const matrix = document.querySelector('.matrix-container');
            const isAtTop = window.scrollY === 0 && (!matrix || matrix.scrollTop === 0);
            const y = e.touches[0].screenY;
            if (y > pStart.y && isAtTop) {
                // Pulling down
                const pullDistance = y - pStart.y;
                if (pullDistance > 60) {
                    document.body.classList.add('refreshing');
                    content.classList.add('refreshing-body');
                }
            } else {
                isPulling = false;
            }
        }, { passive: true });

        document.addEventListener('touchend', function (e) {
            if (!isPulling) return;
            isPulling = false;
            if (document.body.classList.contains('refreshing')) {
                fetchData(true);
            }
        }, { passive: true });

        // Auto update every 6 hours (21600000 ms)
        setInterval(() => {
            fetchData(true);
        }, 6 * 60 * 60 * 1000);

        // Initial fetch
        fetchData();
    </script>
</body>

</html>
